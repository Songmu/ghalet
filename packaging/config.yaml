# yaml-language-server: $schema=https://raw.githubusercontent.com/Songmu/ghalet/main/schema.yaml

# Register authentication with ghalet systemd credential set default --prompt.
# Generated references are stored in /var/lib/ghalet/managed.yaml.

targets:
  - id: project
    scope: OWNER/REPO

runner:
  user: ghalet-runner

logs:
  root: /var/log/ghalet/runners
