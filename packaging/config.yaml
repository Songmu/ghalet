# yaml-language-server: $schema=https://raw.githubusercontent.com/Songmu/ghalet/main/schema.yaml

defaults:
  credential:
    type: pat
    tokenFile: /run/credentials/ghalet.service/default # Register with ghalet systemd credential set default --prompt.

targets:
  - id: project
    scope: OWNER/REPO

runner:
  user: ghalet-runner
  workRoot: /var/lib/ghalet/runs
  distributionRoot: /var/lib/ghalet/runners
  cacheRoot: /var/cache/ghalet/downloads

logs:
  root: /var/log/ghalet/runners
