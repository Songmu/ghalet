name: update-runner
on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: update bundled runner version
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
          version=${tag#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected runner release tag: $tag" >&2
            exit 1
          fi
          export RUNNER_VERSION="$version"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RUNNER_VERSION"]
          patterns = {
              "config.go": r'(?m)^(const defaultRunnerVersion = ")[0-9.]+(")$',
              "examples/config.yaml": r'(?m)^(#   version: ")[0-9.]+(" #.*)$',
          }
          for name, pattern in patterns.items():
              path = Path(name)
              content, count = re.subn(
                  pattern, lambda m: m[1] + version + m[2], path.read_text()
              )
              if count != 1:
                  raise SystemExit(f"Expected one runner version in {name}, got {count}")
              path.write_text(content)
          PY
          if ! git diff --quiet -- config.go examples/config.yaml; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: validate update
        if: steps.update.outputs.version != ''
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
          GOOS=linux go build ./...
          go run ./cmd/ghalet config validate --config examples/config.yaml
          git diff --check
      - name: open update pull request
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_VERSION: ${{ steps.update.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/runner-$RUNNER_VERSION"
          count=$(gh pr list --head "$branch" --state all --json number --jq length)
          if [[ $count != 0 ]]; then
            echo "An update PR already exists for runner $RUNNER_VERSION."
            exit 0
          fi
          gh auth setup-git
          remote=$(git ls-remote --heads origin "$branch")
          if [[ -z $remote ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            git add config.go examples/config.yaml
            git commit -m "Update bundled actions/runner to $RUNNER_VERSION"
            git push --set-upstream origin "$branch"
          fi
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "Update bundled actions/runner to $RUNNER_VERSION" \
            --body "Update the bundled default and example to actions/runner v$RUNNER_VERSION. Explicit runner.version pins are unchanged. The update workflow ran the race-enabled test suite, vet, builds, and example validation before opening this PR."
