name: release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: download release artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        name: release-${{ github.ref_name }}
        path: release
    - name: publish GitHub release
      uses: tcnksm/ghr@v0.18.5
      with:
        owner: ${{ github.repository_owner }}
        repository: ${{ github.event.repository.name }}
        tag: ${{ github.ref_name }}
        token: ${{ github.token }}
        path: release
        replace: "true"
    - name: update major version tag
      uses: haya14busa/action-update-semver@v1.5.1
      with:
        github_token: ${{ github.token }}
        tag: ${{ github.ref_name }}
        major_version_tag_only: true

  publish-image:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: download container binaries
      uses: actions/download-artifact@v8.0.2
      with:
        name: container-binaries-${{ github.ref_name }}
        path: ${{ runner.temp }}/container-binaries
    - name: set image name
      id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - name: set up QEMU
      uses: docker/setup-qemu-action@v4.4.0
      with:
        platforms: arm64
    - name: set up Docker buildx
      uses: docker/setup-buildx-action@v4.4.1
    - name: log in to GHCR
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: build and publish image
      id: build
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        build-contexts: |
          binaries=${{ runner.temp }}/container-binaries
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ github.ref_name }}
    - name: attest image provenance
      uses: actions/attest@v4.2.2
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        subject-version: ${{ github.ref_name }}
        push-to-registry: true
