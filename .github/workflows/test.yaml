name: test
on:
  pull_request:
    branches:
    - "**"
  push:
    branches:
    - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macOS-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
    - name: test
      run: |
        mkdir -p "$RUNNER_TEMP/ghalet-coverage"
        GHALET_TEST_COVERDIR="$RUNNER_TEMP/ghalet-coverage" \
          go test -count=1 -race -coverpkg=./... -coverprofile coverage.out -covermode atomic ./...
        go tool covdata textfmt -i "$RUNNER_TEMP/ghalet-coverage" -o coverage-subprocess.out
    - name: validate builds and example configuration
      run: |
        go vet ./...
        go build ./...
        GOOS=linux go build ./...
        go run ./cmd/ghalet config validate --config examples/config.yaml
        git diff --check
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        files: coverage.out,coverage-subprocess.out
        disable_search: true

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: golang/govulncheck-action@v1.1.0
      with:
        go-version-file: go.mod
