name: pages
on:
  pull_request:
    paths:
    - "docs/**"
    - "README.md"
    - "README.ja.md"
    - ".github/workflows/pages.yaml"
  push:
    branches:
    - main
    paths:
    - "docs/**"
    - "README.md"
    - "README.ja.md"
    - ".github/workflows/pages.yaml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: docs/site/go.mod
        cache: false
    - name: Read Hugo version
      id: hugo-version
      run: echo "version=$(cat docs/site/.hugo-version)" >> "$GITHUB_OUTPUT"
    - uses: peaceiris/actions-hugo@v3.2.1
      with:
        hugo-version: ${{ steps.hugo-version.outputs.version }}
        extended: true
    - name: Configure Pages
      id: pages
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: actions/configure-pages@v6.0.0
    - name: Build documentation
      env:
        HUGO_BASEURL: ${{ steps.pages.outputs.base_url || 'https://songmu.github.io/ghalet/' }}
      run: bash docs/site/build.sh "$RUNNER_TEMP/site"
    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@v5.0.1
