# yaml-language-server: $schema=https://raw.githubusercontent.com/Songmu/ghalet/main/schema.yaml

# Relative paths use this file's directory.

# capacity:
#   maxRunners: 2 # Total runner limit.

# defaults:
#   credential:
#     type: gh # Shared by targets that omit credential.
#     hostname: "" # Defaults to the scope's host.

targets:
  - id: project
    # Unique local ID for management commands.
    scope: OWNER/REPO
    # GitHub.com: OWNER/REPO or ORG; other hosts: full HTTPS URL.
    # Enterprise scopes are unsupported.
    # credential:
    #   type: gh # Overrides defaults.credential; uses the launching user's gh login.
    #   hostname: "" # gh only; defaults to scope's host.

    # credential: # PAT alternative.
    #   type: pat
    #   tokenFile: credentials/token # chmod 600; use this or tokenEnv.

    # credential: # GitHub App alternative.
    #   type: github-app
    #   clientId: "<app-client-id>"
    #   privateKeyFile: credentials/app.pem # chmod 600.
    # installationId: 12345 # Required for github-app; per target.

    # runnerGroup: "" # Org only; empty uses default group.
    # scaleSet: project # Defaults to id; GitHub name and runs-on label.
    # scaling:
    #   minRunners: 0 # Idle warm runners.
    #   maxRunners: 2 # Per-target limit; shared capacity applies.

  # - id: another-project # Optional second target.
  #   scope: OWNER/ANOTHER-REPO
  #   scaleSet: macmini

# runner:
#   version: "2.338.0" # Bundled default; override to pin another version.
#   user: "" # Empty: current user. Root must set a non-root user.
#   startupTimeout: 2m # Runner readiness deadline.
#   drainTimeout: 10m # Grace period before forced stop.
#   env: {} # Explicit job env; the parent's env is not inherited.

# logs: # Runner log archives; daemon stdout/stderr are managed separately.
#   preserve: true # Archive logs before cleanup.
#   retention: 7d # Log retention (d, h, m, s).
#   root: /absolute/path/to/logs # Default: $XDG_STATE_HOME/ghalet/logs or ~/.local/state/ghalet/logs.
