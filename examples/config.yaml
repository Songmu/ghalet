apiVersion: ghalet/v1alpha1

capacity:
  maxRunners: 2

credentials:
  personal:
    type: gh
    hostname: github.com
  # organization:
  #   type: github-app
  #   clientId: "<app-client-id>"
  #   privateKeyFile: credentials/app.pem
  # token:
  #   type: pat
  #   tokenFile: credentials/token
  #   # Alternatively use tokenEnv: MY_GITHUB_TOKEN (not both).

scopes:
  project:
    url: https://github.com/OWNER/REPO
    credentialRef: personal
  # organization:
  #   url: https://github.com/EXAMPLE-ORG
  #   credentialRef: organization
  #   installationId: 12345

targets:
  - id: project
    scopeRef: project
    scaleSetName: macmini
    scaling:
      minRunners: 0
      maxRunners: 2
  # - id: organization
  #   scopeRef: organization
  #   runnerGroup: existing-build-runners
  #   scaleSetName: linux-arm64
  #   scaling:
  #     minRunners: 0
  #     maxRunners: 2

runner:
  version: "2.338.0"
  # user: ci-runner
  startupTimeout: 2m
  drainTimeout: 30m
  workRoot: runs
  distributionRoot: runners
  cacheRoot: downloads
  env:
    LANG: en_US.UTF-8

cleanup:
  preserveLogs: true
  logRetention: 7d
  logRoot: logs
