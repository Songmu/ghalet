# yaml-language-server: $schema=https://raw.githubusercontent.com/Songmu/ghalet/main/schema.yaml

targets:
  - id: project
    scope: OWNER/REPO
    credential:
      type: pat
      tokenFile: /etc/ghalet/credentials/token # Owner-only file, normally chmod 600.

runner:
  workRoot: /var/lib/ghalet/runs
  distributionRoot: /var/lib/ghalet/runners
  cacheRoot: /var/cache/ghalet/downloads

cleanup:
  logRoot: /var/log/ghalet/runners
